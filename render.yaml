databases:
  - name: team-b-db
    plan: free
    databaseName: appdb
    user: appuser

services:
  - type: web
    name: team-b-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL_OVERRIDE
        fromDatabase:
          name: team-b-db
          property: connectionString
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: redis
    name: team-b-redis
    plan: free
    maxmemoryPolicy: noeviction